<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="edge"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <!-- chip body -->
  <circle cx="50" cy="50" r="48" fill="#111"/>
  <!-- edge spots: 6 white rectangles around the rim -->
  <g clip-path="url(#edge)" fill="#f4f4f4">
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(0 50 50)"/>
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(60 50 50)"/>
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(120 50 50)"/>
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(180 50 50)"/>
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(240 50 50)"/>
    <rect x="44" y="0" width="12" height="15" rx="1.5" transform="rotate(300 50 50)"/>
  </g>
  <!-- outer rim line -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#000" stroke-width="2"/>
  <!-- inner inlay -->
  <circle cx="50" cy="50" r="31" fill="#1c1c1c" stroke="#f4f4f4" stroke-width="2"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#d4a017" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- denomination -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="Oswald, 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="22" fill="#f4f4f4" letter-spacing="0.5">100</text>
</svg>
